<app-nav />

@if (profile(); as p) {
  <app-hero       [personal]="p.personal" ngSkipHydration />

  <div class="stats">
    <div class="container stats__inner">
      <div class="stats__item"><span class="stats__n">3<span class="accent">+</span></span><span class="stats__l">Anos de experiência</span></div>
      <div class="stats__sep"></div>
      <div class="stats__item"><span class="stats__n stats__n--brand">PicPay</span><span class="stats__l">Fintech de alta escala</span></div>
      <div class="stats__sep"></div>
      <div class="stats__item"><span class="stats__n">Full<span class="accent">stack</span></span><span class="stats__l">Java · Spring · Angular</span></div>
      <div class="stats__sep"></div>
      <div class="stats__item"><span class="stats__n">μS<span class="accent">+</span></span><span class="stats__l">Arquitetura distribuída</span></div>
    </div>
  </div>

  <app-about      [personal]="p.personal" />
  <app-experience [experiences]="p.experience" />
  <app-stack      [skills]="p.skills" />
  <app-education  [education]="p.education" />
  <app-contact    [personal]="p.personal" />
}

@if (!profile()) {
  <div class="loading-screen">
    <div class="loading-spinner"></div>
  </div>
}

<footer class="footer">
  <div class="container footer__inner">
    <a href="#top" class="nav__logo">EB<span class="accent">.</span></a>
    <p>Eduardo Borges · Backend Engineer · Uberlândia, MG</p>
    <p class="footer__credit">Feito com código limpo ☕</p>
  </div>
</footer>
