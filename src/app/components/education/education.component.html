<section class="section section--alt" id="education">
  <div class="container">
    <div class="section__label">// education &amp; certs</div>
    <h2 class="section__title">Formação &amp; Certificações</h2>
    <div class="edu__grid">
      @for (item of education; track item.degree) {
        <div class="edu__card reveal">
          <div class="edu__icon">{{ item.icon }}</div>
          <div class="edu__content">
            <h3>{{ item.degree }}</h3>
            <p class="edu__institution">{{ item.institution }}</p>
            <span class="edu__period">{{ item.period }}</span>
          </div>
        </div>
      }
    </div>
  </div>
</section>
