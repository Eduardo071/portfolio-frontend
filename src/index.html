  <script>
    // Scroll reveal — runs after Angular hydrates
    function initReveal() {
      const obs = new IntersectionObserver((entries) => {
        entries.forEach((e, i) => {
          if (!e.isIntersecting) return;
          const siblings = [...e.target.parentElement.querySelectorAll('.reveal:not(.visible)')];
          e.target.style.transitionDelay = Math.min(siblings.indexOf(e.target) * 80, 320) + 'ms';
          e.target.classList.add('visible');
          obs.unobserve(e.target);
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
      document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
    }
    document.addEventListener('DOMContentLoaded', () => setTimeout(initReveal, 300));
  </script>
